    $("list").querySelectorAll(".sel").forEach(c => c.onchange = () => { c.checked ? off.delete(c.dataset.id) : off.add(c.dataset.id); mode = "route"; render(); });
    $("list").querySelectorAll(".num[data-i]").forEach(b => b.onclick = () => { focus = +b.dataset.i; mode = "point"; render(); $("map").scrollIntoView({ behavior: "smooth", block: "start" }); });
    $("list").querySelectorAll(".cp").forEach(b => b.onclick = () => {
      const ok = () => { b.textContent = "已複製"; setTimeout(() => b.textContent = "複製", 1500); };
      if (navigator.clipboard) navigator.clipboard.writeText(b.dataset.a).then(ok, () => {}); else ok();
    });
    bindGrids($("list"));
  }
  function renderAlbum() {
    document.documentElement.style.setProperty("--c", "#444");
    $("album").innerHTML = TRIP.days.map((d, i) => {
      const parts = d.stops.map(s => { const l = ofStop(s.id); return l.length ? `<h3>${esc(s.name)}</h3>${grid(l, true)}` : ""; }).join("");
      const o = ofDay(d);
      const body = parts + (o.length ? `<h3>其他</h3>${grid(o, true)}` : "");
      return body ? `<section style="--c:${COLORS[i % COLORS.length]}"><h2><span class="dn">DAY ${i + 1}</span> ${esc(d.date)} ${esc(d.title)}</h2>${body}</section>` : "";
    }).join("");
    bindGrids($("album"));
  }

  // 全螢幕看照片：左右鍵、滑動、Esc 關閉
  let lb = { g: 0, i: 0 };
  function openLB(g, i) { lb = { g, i }; showLB(); $("lb").classList.remove("hide"); document.body.style.overflow = "hidden"; }
  function closeLB() { $("lb").classList.add("hide"); document.body.style.overflow = ""; $("lbimg").removeAttribute("src"); }
  function showLB() {
    const list = groups[lb.g], p = list[lb.i];
    $("lbimg").src = p.f; $("lbcap").textContent = `${p.t}　${lb.i + 1} / ${list.length}`;
    $("lbprev").disabled = lb.i === 0; $("lbnext").disabled = lb.i === list.length - 1;
  }
  const step = k => { const n = lb.i + k; if (n >= 0 && n < groups[lb.g].length) { lb.i = n; showLB(); } };
  $("lbprev").onclick = () => step(-1); $("lbnext").onclick = () => step(1); $("lbx").onclick = closeLB;
  $("lb").onclick = e => { if (e.target === $("lb")) closeLB(); };
  addEventListener("keydown", e => { if ($("lb").classList.contains("hide")) return; if (e.key === "Escape") closeLB(); if (e.key === "ArrowLeft") step(-1); if (e.key === "ArrowRight") step(1); });
  let sx = null;
  $("lb").addEventListener("touchstart", e => { sx = e.touches[0].clientX; }, { passive: true });
  $("lb").addEventListener("touchend", e => { if (sx == null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1); sx = null; });

  $("mr").onclick = () => { mode = "route"; render(); };
  $("mp").onclick = () => { mode = "point"; render(); };
  render();
})();
</script></body></html>
